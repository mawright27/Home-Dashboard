<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Dashboard</title>

<meta name="theme-color" content="#07090D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles.css">

<script>
/* Surfaces startup errors on screen instead of leaving a black page.
   Deliberately plain JavaScript in the document head: it must run even
   when the module scripts below fail to parse or load. */
(function(){
  var shown = false;

  function show(title, detail){
    if (shown) return;
    shown = true;
    var inner = document.getElementById('gateInner');
    if (!inner) return;

    var safe = function(s){
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    };

    inner.innerHTML =
      '<h1 class="gate__title" style="color:#FFB020">' + safe(title) + '</h1>' +
      '<pre class="gate__err">' + safe(detail) + '</pre>' +
      '<p class="gate__msg">Press F12 and open the Console tab for the full trace. ' +
      'A syntax error in config.js is the usual cause after editing it.</p>';

    var gate = document.getElementById('gate');
    if (gate) gate.hidden = false;
  }

  window.addEventListener('error', function(e){
    if (e.target && e.target.tagName === 'SCRIPT'){
      return show('A script failed to load', (e.target.src || 'unknown file') +
        '\n\nCheck the filename and that the file is in this folder.');
    }
    show('Startup error', (e.message || 'Unknown error') +
      (e.filename ? '\n\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
  }, true);

  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    show('Startup error', (r && (r.message || r)) || 'Unknown error');
  });

  // If nothing has rendered after a few seconds, say so rather than sit black.
  setTimeout(function(){
    var frame = document.getElementById('frame');
    var gate  = document.getElementById('gate');
    if (frame && frame.hidden && gate && gate.hidden){
      show('Nothing rendered',
        'The page loaded but neither the dashboard nor the sign-in screen appeared.\n' +
        'This usually means a module failed to import.');
    }
  }, 6000);
})();
</script>
</head>

<body>

<!-- ══ Gate: shown until we know who this browser is ══════════ -->
<div class="gate" id="gate">
  <div class="gate__card" id="gateCard">
    <div class="gate__spinner"></div>
    <p class="gate__msg">Starting up</p>
  </div>
</div>

<!-- ══ Dashboard ══════════════════════════════════════════════ -->
<div class="frame" id="frame" hidden>

  <header class="head">
    <div class="head__time">
      <div class="clock" id="clock">--:--</div>
      <div class="clock__meta">
        <span class="clock__ampm" id="ampm">--</span>
        <span class="clock__date" id="date">&nbsp;</span>
      </div>
    </div>

    <div class="head__right">
      <div class="head__statusline">
        <button class="account" id="account" type="button" hidden>
          <span class="account__avatar" id="accountAvatar"></span>
          <span class="account__name" id="accountName">Sign in</span>
        </button>

        <div class="status" id="status" data-state="syncing">
          <span class="status__dot"></span>
          <span class="status__label" id="statusLabel">Starting</span>
        </div>
      </div>
      <div class="status__sub" id="statusSub">No data yet</div>
    </div>
  </header>

  <main class="grid">

    <section class="panel panel--cal">
      <div class="panel__head">
        <h2 class="panel__title">Calendar</h2>
        <span class="panel__note" id="calRange">&nbsp;</span>
      </div>
      <div class="cal" id="cal"></div>
    </section>

    <div class="side">

      <section class="panel panel--wx">
        <div class="panel__head">
          <h2 class="panel__title">Weather</h2>
          <button class="panel__note panel__note--btn" id="wxPlace" type="button">&nbsp;</button>
        </div>
        <div class="wx">
          <div class="wx__now">
            <div class="wx__icon" id="wxNowIcon"></div>
            <div class="wx__temp" id="wxNowTemp">--&deg;</div>
            <div class="wx__cond" id="wxNowCond">&nbsp;</div>
            <div class="wx__feels" id="wxNowFeels">&nbsp;</div>
          </div>
          <div class="wx__days" id="wxDays"></div>
        </div>
      </section>

      <section class="panel panel--groc">
        <div class="panel__head">
          <h2 class="panel__title">Grocery</h2>
          <span class="panel__note" id="grocCount">&nbsp;</span>
        </div>
        <div class="groc" id="groc"></div>
        <p class="groc__note" id="grocSheetNote" hidden>
          Edited in your published Google Sheet. Changes show up here within two minutes.
        </p>
        <div class="groc__tools" id="grocTools" hidden>
          <button class="btn btn--ghost" id="grocAdd" type="button">+ Add item <kbd>A</kbd></button>
          <button class="btn btn--ghost" id="grocClear" type="button">Clear checked</button>
          <a class="btn btn--ghost" id="grocPhone" href="./list.html" target="_blank" rel="noopener">Phone list &#8599;</a>
        </div>
      </section>

      <section class="tiles" id="tiles" aria-label="Sensors"></section>

    </div>
  </main>

  <div class="hint" id="hint" hidden>
    <kbd>A</kbd> add item &nbsp;·&nbsp; <kbd>E</kbd> add event &nbsp;·&nbsp;
    <kbd>S</kbd> settings &nbsp;·&nbsp; <kbd>K</kbd> kiosk mode
  </div>
</div>

<!-- ══ Modal host ═════════════════════════════════════════════ -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim" id="modalScrim"></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__head">
      <h3 class="modal__title" id="modalTitle">Title</h3>
      <button class="icon-btn" id="modalClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
